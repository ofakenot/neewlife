<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>newlifelabs.us system · Operação</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts Google (iOS Light Style: Plus Jakarta Sans, Manrope, Bebas Neue, DM Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom Light Glassmorphism CSS -->
  <link rel="stylesheet" href="style.css" />

  <style id="newLifeIndexTheme">
    :root { --nl-blue:#1769d1; --nl-blue-2:#2f8cf0; --nl-ink:#172235; }
    html, body { min-height:100%; }
    body {
      margin:0;
      background:linear-gradient(145deg,#f7faff 0%,#eef4f9 55%,#e9f1f7 100%);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .login-screen {
      min-height:100vh !important;
      min-height:100dvh !important;
      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      padding:24px !important;
      background:radial-gradient(circle at 18% 0%,rgba(91,165,255,.17),transparent 31rem),radial-gradient(circle at 90% 20%,rgba(157,126,255,.13),transparent 29rem),transparent !important;
    }
    .login-card {
      width:min(100%,430px) !important;
      margin:0 auto !important;
      padding:clamp(26px,5vw,42px) !important;
      border-radius:24px !important;
      background:rgba(255,255,255,.82) !important;
      border:1px solid rgba(255,255,255,.96) !important;
      box-shadow:0 22px 65px rgba(38,61,91,.13),0 2px 10px rgba(38,61,91,.05) !important;
      backdrop-filter:blur(18px) saturate(125%);
      -webkit-backdrop-filter:blur(18px) saturate(125%);
    }
    .login-brand { margin:0 auto 18px !important; display:grid !important; place-items:center !important; width:48px !important; height:48px !important; border-radius:15px !important; background:linear-gradient(145deg,var(--nl-blue-2),var(--nl-blue)) !important; color:#fff !important; box-shadow:0 10px 22px rgba(23,105,209,.22) !important; }
    .login-kicker { text-align:center; color:#3c83d9 !important; letter-spacing:.16em !important; font-size:10px !important; font-weight:900 !important; }
    .login-card h1 { text-align:center; color:var(--nl-ink) !important; letter-spacing:-.045em !important; font-size:clamp(25px,6vw,34px) !important; margin-top:10px !important; }
    .login-card h1 span { color:var(--nl-blue) !important; }
    .login-description { text-align:center !important; color:#718096 !important; margin:10px auto 25px !important; }
    .login-form { display:flex !important; flex-direction:column !important; gap:16px !important; }
    .login-form label { color:#506075 !important; font-size:11px !important; font-weight:800 !important; }
    .login-form .control { width:100% !important; min-height:46px !important; margin-top:7px !important; box-sizing:border-box !important; border-radius:12px !important; border:1px solid #d7e1ec !important; background:#fff !important; }
    .password-wrap { position:relative; }
    .password-wrap .control { padding-right:78px !important; }
    .field-toggle { position:absolute; right:9px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:var(--nl-blue); font-size:11px; font-weight:800; cursor:pointer; }
    .login-submit { width:100% !important; min-height:48px !important; display:flex !important; align-items:center !important; justify-content:center !important; gap:9px !important; margin:4px auto 0 !important; border-radius:12px !important; background:linear-gradient(135deg,var(--nl-blue-2),var(--nl-blue)) !important; box-shadow:0 9px 20px rgba(23,105,209,.2) !important; }
    .login-help { text-align:center !important; color:#9aa6b5 !important; margin-top:19px !important; font-size:10px !important; }
    .login-error { min-height:16px; text-align:center; color:#c2414c; font-size:11px; font-weight:700; }
    #newLifePreloader {
      position:fixed; inset:0; z-index:99999; display:grid; place-items:center;
      background:linear-gradient(145deg,#f7faff 0%,#edf4fa 58%,#e7eff7 100%);
      opacity:1; visibility:visible; transition:opacity .45s ease,visibility .45s ease;
    }
    #newLifePreloader.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .new-life-loader { display:flex; flex-direction:column; align-items:center; gap:16px; color:var(--nl-ink); }
    .new-life-loader-word { font-size:clamp(30px,8vw,58px); font-weight:900; letter-spacing:-.075em; line-height:1; }
    .new-life-loader-word span { color:var(--nl-blue); }
    .new-life-loader-line { width:92px; height:3px; overflow:hidden; border-radius:99px; background:#dbe7f2; }
    .new-life-loader-line::after { content:""; display:block; width:42%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--nl-blue-2),#7ebcff); animation:newLifeLoad 1.15s ease-in-out infinite; }
    @keyframes newLifeLoad { 0%{transform:translateX(-130%)} 50%{transform:translateX(110%)} 100%{transform:translateX(250%)} }
    /* Compatibilidade com style.css: o app.js cria o painel interno depois do login. */
    .app-content { padding:0 !important; overflow:visible !important; }
    .app-responsive-sidebar { gap:0 !important; }
    #appRoot { min-height:100vh; }
    #loginScreen { position:relative !important; z-index:1 !important; }
    @media (max-width:480px) { .login-screen { padding:16px !important; } .login-card { padding:28px 20px !important; border-radius:20px !important; } }
    @media (prefers-reduced-motion:reduce) { #newLifePreloader { transition:none; } .new-life-loader-line::after { animation:none; transform:translateX(70%); } }
  </style>
</head>
<body class="bg-[#f1f5f9] text-slate-900 antialiased selection:bg-sky-500 selection:text-white">
  <div id="newLifePreloader" role="status" aria-label="Carregando New Life">
    <div class="new-life-loader">
      <div class="new-life-loader-word">new <span>life</span></div>
      <div class="new-life-loader-line" aria-hidden="true"></div>
    </div>
  </div>


  <!-- Tela de Login -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card glass-panel">
      <div class="brand-mark login-brand">✦</div>
      <div class="login-kicker">FIELD INTELLIGENCE</div>
      <h1>Bem-vindo ao <span>newlifelabs.us</span></h1>
      <p class="login-description">Entre para acompanhar sua operação em campo.</p>
      
      <form id="loginForm" class="login-form">
        <label>
          Usuário
          <input id="loginUser" class="control" type="text" autocomplete="username" placeholder="Digite seu usuário" required />
        </label>
        
        <label>
          Senha
          <div class="password-wrap">
            <input id="loginPassword" class="control" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
            <button type="button" id="togglePassword" class="field-toggle">Mostrar</button>
          </div>
        </label>

        <div id="loginError" class="login-error"></div>
        <button class="primary-btn login-submit" type="submit">
          Entrar no sistema <span>→</span>
        </button>
      </form>
      <div class="login-help">Acesso protegido · Ambiente operacional</div>
    </div>
  </section>

  <!-- Scripts Externos -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  
  <!-- JavaScript Principal -->
  <script src="app.js?v=24"></script>

  <script>
    window.setTimeout(function () {
      var loader = document.getElementById('newLifePreloader');
      if (loader) loader.classList.add('is-hidden');
    }, 3000);
  </script>
</body>
</html>
